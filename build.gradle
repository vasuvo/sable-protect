plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude('**/*.bbmodel')
    exclude('src/generated/**/.cache')
}

repositories {
    mavenLocal()
    mavenCentral()

    exclusiveContent {
        forRepository {
            maven {
                url = 'https://maven.ryanhcode.dev/releases'
                name = 'RyanHCode Maven'
            }
        }
        filter {
            includeGroup('dev.ryanhcode.sable-companion')
        }
    }

    // Veil (foundry.veil) — the networking layer Sable / Sim-Project use to dispatch
    // custom packets. We need its types (ServerPacketContext, PacketContext) at compile
    // time for the mixins that inject into those packet handlers.
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
    }

    // Create — needed at compile time for the contraption-breaker mixin types
    // (MovementContext, BlockBreakingMovementBehaviour, DrillMovementBehaviour).
    // Provided at runtime by the user's Create install.
    maven {
        name = 'CreateMod'
        url = 'https://maven.createmod.net'
    }

    // LuckPerms API — soft dependency; if the user has LuckPerms installed our
    // permission checks delegate to it.
    maven {
        name = 'LuckPerms'
        url = 'https://repo.lucko.me/'
    }
}

base {
    archivesName = mod_id
}

java {
    sourceCompatibility = JavaVersion.VERSION_23
    targetCompatibility = JavaVersion.VERSION_23
    toolchain {
        languageVersion = JavaLanguageVersion.of(23)
    }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    // Sable API — compile-only; provide the full mod at runtime via localRuntime
    compileOnly("dev.ryanhcode.sable:sable-common-${project.minecraft_version}:${project.sable_version}")

    // Sable Companion — lightweight shim for optional Sable compatibility
    implementation("dev.ryanhcode.sable-companion:sable-companion-common-${project.minecraft_version}:${project.sable_companion_version}")

    // Sable full mod for local dev runs only
    localRuntime("dev.ryanhcode.sable:sable-neoforge-${project.minecraft_version}:${project.sable_version}") {
        exclude group: 'com.simibubi.create', module: "create-${project.minecraft_version}"
        exclude group: 'net.createmod.ponder', module: 'ponder-neoforge'
        exclude group: 'dev.engine-room.flywheel', module: "flywheel-neoforge-${project.minecraft_version}"
        exclude group: 'com.tterrag.registrate', module: 'Registrate'
    }

    // Veil — compile-only; provided at runtime by the user's modded instance (Sable / Sim-Project bring it).
    // Needed for the ServerPacketContext type referenced by Sim-Project packet handlers.
    compileOnly("foundry.veil:veil-neoforge-${project.minecraft_version}:${project.veil_version}") {
        transitive = false
    }

    // LuckPerms — compile-only soft dependency. The bridge class is only loaded when
    // ModList reports LuckPerms is installed, so the mod runs cleanly without it.
    compileOnly("net.luckperms:api:${project.luckperms_version}")

    // Create — compile-only; provided by user's runtime. Needed for the drill
    // protection mixin to reference MovementContext / DrillMovementBehaviour /
    // BlockBreakingMovementBehaviour with real types instead of @Coerce Object,
    // which (combined with stringly-typed @Mixin targets) silently failed to apply.
    compileOnly("com.simibubi.create:create-${project.minecraft_version}:${project.create_version}") { transitive = false }

    testImplementation(platform('org.junit:junit-bom:5.10.2'))
    testImplementation('org.junit.jupiter:junit-jupiter')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher')
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version            : neo_version,
        loader_version_range   : loader_version_range,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : mod_version,
    ]

    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

File deployConfigFile = file('deploytmux.properties')
Properties deployConfig = new Properties()
String deployBranch, deployRepoUrl
List<String> requestedTasks = gradle.startParameter.taskNames
int deployIndex = requestedTasks.findIndexOf { it == 'deploytmux' || it.endsWith(':deploytmux') }
String deployMessage = deployIndex < 0 ? null : requestedTasks.drop(deployIndex + 1).join(' ')
if (deployMessage) gradle.startParameter.setTaskNames(requestedTasks.take(deployIndex + 1))

def deployCommit = tasks.register('deployCommit') {
    doLast {
        Process status = new ProcessBuilder(['git', 'status', '--porcelain']).start()
        String changes = status.inputStream.text
        if (status.waitFor()) throw new GradleException('git status failed')
        List commands = []
        if (changes) {
            if (!deployMessage) {
                print 'Please write a commit message to continue the build: '
                System.out.flush()
            }
            String message = deployMessage ?: System.in.newReader().readLine()?.trim()
            if (!message) throw new GradleException('Commit message cannot be empty')
            commands.addAll([['add', '.'], ['commit', '-m', message]])
        }
        commands.add(['push', 'origin', deployBranch])
        commands.each { arguments ->
            Process git = new ProcessBuilder(['git'] + arguments).inheritIO().start()
            if (git.waitFor()) throw new GradleException("git ${arguments[0]} failed")
        }
    }
}
tasks.configureEach { if (name != 'deployCommit') mustRunAfter deployCommit }

def deploytmux = tasks.register('deploytmux', Exec) {
    dependsOn deployCommit, jar

    doFirst {
        String host = deployConfig.getProperty('host')
        String folder = deployConfig.getProperty('folder')
        String session = deployConfig.getProperty('session')
        String window = deployConfig.getProperty('window')
        String repo = deployConfig.getProperty('repo')
        File artifact = tasks.named('jar', Jar).get().archiveFile.get().asFile

        providers.exec {
            commandLine 'scp', artifact.absolutePath, "${host}:${folder}/.${mod_id}-deploy.jar"
        }.result.get().assertNormalExitValue()
        commandLine 'ssh', host, 'sh', '-s', '--', session, window, folder, artifact.name, mod_id, deployRepoUrl, deployBranch, "$repo/${rootProject.name}"
        standardInput = new ByteArrayInputStream(file('gradle/deploytmux.sh').getText('UTF-8').replace('\r\n', '\n').getBytes('UTF-8'))
    }
}

gradle.taskGraph.whenReady {
    if (!it.hasTask(deploytmux.get())) return
    if (!deployConfigFile.exists()) deployConfigFile.setText('''configured=false
host=printer@ssh.aerosmp.com
folder=/home/printer/Desktop/Mod_Testing
session=printer_session
window=Mod_Testing
''', 'UTF-8')
    deployConfigFile.withInputStream { deployConfig.load(it) }
    if (!deployConfig.getProperty('repo')) {
        String repo = "/home/${deployConfig.getProperty('host').split('@')[0]}/Desktop"
        deployConfigFile.append("repo=$repo\n", 'UTF-8')
        deployConfig.setProperty('repo', repo)
    }
    if (deployConfig.getProperty('configured') != 'true')
        throw new GradleException("Set configured=true in ${deployConfigFile} before deploying")
    deployBranch = providers.exec { commandLine 'git', 'branch', '--show-current' }.standardOutput.asText.get().trim()
    deployRepoUrl = providers.exec { commandLine 'git', 'remote', 'get-url', 'origin' }.standardOutput.asText.get().trim()
    if (!deployBranch) throw new GradleException('deploytmux requires a local branch')
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
